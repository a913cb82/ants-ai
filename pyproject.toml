[build-system]
requires = ["setuptools>=61"]

[project]
name = "ants-ai"
version = "0.1.0"
description = "Ants game from the 2011 AI Challenge: game engine and bots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openskill"]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools]
# No distributable packages. Engine and bots run as scripts.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "autoresearch/tests"]
markers = ["slow: builds real worktrees and plays a game"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "T10"]

[tool.mypy]
python_version = "3.10"
files = ["league", "autoresearch", "tests", "conftest.py", "tools", "bots"]
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# The engine and the reference bots are untyped upstream code. Check
# the annotated functions there, but not the untyped bodies.
[[tool.mypy.overrides]]
module = ["tools.*", "bots.*"]
check_untyped_defs = false

[build-system]
requires = ["setuptools>=61"]

[project]
name = "ants-ai"
version = "0.1.0"
description = "Ants game from the 2011 AI Challenge: game engine and bots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openskill"]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools]
# No distributable packages. Engine and bots run as scripts.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "autoresearch/tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["tools", "vendor", "bots"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "T10"]

[tool.ruff.lint.per-file-ignores]
# The starter bot uses the upstream star import.
"autoresearch/bot/*" = ["F403", "F405"]

[tool.mypy]
python_version = "3.10"
files = ["league", "autoresearch", "tests", "conftest.py"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

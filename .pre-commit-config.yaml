# Install once: pre-commit install
# Run every hook on every file: pre-commit run --all-files
# Game map data is not source. Do not rewrite it.
exclude: '\.map$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '\.jsonl$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
        # The game log is data and grows on purpose.
        exclude: '\.map$|^league/games\.jsonl$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q -m "not slow"
        language: system
        files: \.py$
        pass_filenames: false
